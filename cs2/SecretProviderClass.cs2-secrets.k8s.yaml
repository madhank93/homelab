apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cs2-secrets
  namespace: cs2
spec:
  parameters:
    objects: |-
      - objectName: "RCON_PASSWORD"
        secretPath: "secret/data/cs2"
        secretKey: "RCON_PASSWORD"
      - objectName: "JOIN_PASSWORD"
        secretPath: "secret/data/cs2"
        secretKey: "JOIN_PASSWORD"
    roleName: cs2
    vaultAddress: http://openbao.openbao.svc.cluster.local:8200
  provider: openbao
  secretObjects:
    - data:
        - key: RCON_PASSWORD
          objectName: RCON_PASSWORD
        - key: JOIN_PASSWORD
          objectName: JOIN_PASSWORD
      secretName: cs2-secrets
      type: Opaque
