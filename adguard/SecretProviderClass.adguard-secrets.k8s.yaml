apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: adguard-secrets
  namespace: adguard
spec:
  parameters:
    objects: |-
      - objectName: "ADMIN_PASSWORD"
        secretPath: "secret/data/adguard"
        secretKey: "ADMIN_PASSWORD"
      - objectName: "ADMIN_PASSWORD_HASH"
        secretPath: "secret/data/adguard"
        secretKey: "ADMIN_PASSWORD_HASH"
    roleName: adguard
    vaultAddress: http://openbao.openbao.svc.cluster.local:8200
  provider: openbao
