apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: headlamp-secrets
  namespace: headlamp
spec:
  parameters:
    objects: |-
      - objectName: "OIDC_CLIENT_SECRET"
        secretPath: "secret/data/headlamp"
        secretKey: "OIDC_CLIENT_SECRET"
    roleName: headlamp
    vaultAddress: http://openbao.openbao.svc.cluster.local:8200
  provider: openbao
  secretObjects:
    - data:
        - key: OIDC_CLIENT_SECRET
          objectName: OIDC_CLIENT_SECRET
      secretName: headlamp-oidc
      type: Opaque
