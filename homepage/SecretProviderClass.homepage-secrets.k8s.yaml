apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: homepage-secrets
  namespace: homepage
spec:
  parameters:
    objects: |-
      - objectName: "AUTH_SECRET"
        secretPath: "secret/data/homepage"
        secretKey: "AUTH_SECRET"
      - objectName: "OAUTH_CLIENT_SECRET"
        secretPath: "secret/data/homepage"
        secretKey: "OAUTH_CLIENT_SECRET"
    roleName: homepage
    vaultAddress: http://openbao.openbao.svc.cluster.local:8200
  provider: openbao
  secretObjects:
    - data:
        - key: AUTH_SECRET
          objectName: AUTH_SECRET
        - key: OAUTH_CLIENT_SECRET
          objectName: OAUTH_CLIENT_SECRET
      secretName: homepage-secrets
      type: Opaque
