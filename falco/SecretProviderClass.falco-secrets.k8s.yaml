apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: falco-secrets
  namespace: falco
spec:
  parameters:
    objects: |-
      - objectName: "FALCOSIDEKICK_UI_USER"
        secretPath: "secret/data/falco"
        secretKey: "FALCOSIDEKICK_UI_USER"
    roleName: falco
    vaultAddress: http://openbao.openbao.svc.cluster.local:8200
  provider: openbao
  secretObjects:
    - data:
        - key: FALCOSIDEKICK_UI_USER
          objectName: FALCOSIDEKICK_UI_USER
      secretName: falcosidekick-ui-auth
      type: Opaque
