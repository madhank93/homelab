apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/version: v1.13.0
    helm.sh/chart: longhorn-1.13.0
  name: longhorn-default-setting
  namespace: longhorn-system
data:
  default-setting.yaml: |-
    create-default-disk-labeled-nodes: false
    default-data-path: "/var/lib/longhorn/"
    storage-over-provisioning-percentage: "300"
    default-replica-count: "3"
    taint-toleration: "dedicated=ai:NoSchedule"
    priority-class: "longhorn-critical"
    node-down-pod-deletion-policy: "delete-both-statefulset-and-deployment-pod"
    disable-revision-counter: "{\"v1\":\"true\"}"
    concurrent-automatic-engine-upgrade-per-node-limit: "1"
