apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notebook-gateway-controller
  namespace: kubeflow
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
