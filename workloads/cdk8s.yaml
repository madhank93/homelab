language: go
app: go run .
# Every entry here generates typed Go constructs into workloads/imports/.
# Only add a chart when a construct actually imports the generated package —
# an unused entry costs synth time and drifts silently from what is deployed.
#
# Charts rendered with cdk8s.NewHelm (raw values maps, no typed construct) are
# versioned at the call site instead, not here. Those are: cloudnative-pg,
# falco, nvidia-device-plugin, dcgm-exporter, opentelemetry-collector,
# reloader, secrets-store-csi-driver, openbao, victoria-metrics-k8s-stack
# and n8n.
imports:
  # Kubernetes API types — keep aligned with the cluster (Talos ships 1.36.x).
  - k8s@1.36.0
  - helm:https://grafana-community.github.io/helm-charts/grafana@12.4.1
  - helm:https://helm.goharbor.io/harbor@1.19.0
  - helm:https://otwld.github.io/ollama-helm/ollama@1.57.0
  - helm:https://victoriametrics.github.io/helm-charts/victoria-logs-single@0.12.5
  - helm:https://aquasecurity.github.io/helm-charts/trivy-operator@0.32.1
  - helm:https://kubernetes-sigs.github.io/headlamp/headlamp@0.42.0
  - helm:https://kyverno.github.io/kyverno/kyverno@3.8.1
  - helm:https://charts.longhorn.io/longhorn@1.11.2
  - helm:https://kubernetes-sigs.github.io/metrics-server/metrics-server@3.13.0
