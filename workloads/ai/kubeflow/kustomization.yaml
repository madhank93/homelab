apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
    - Namespace
    - ResourceQuota
    - StorageClass
    - CustomResourceDefinition
    - MutatingWebhookConfiguration
    - ServiceAccount
    - PodSecurityPolicy
    - NetworkPolicy
    - Role
    - ClusterRole
    - RoleBinding
    - ClusterRoleBinding
    - ConfigMap
    - Secret
    - Endpoints
    - Service
    - LimitRange
    - PriorityClass
    - PersistentVolume
    - PersistentVolumeClaim
    - Deployment
    - StatefulSet
    - CronJob
    - PodDisruptionBudget
    orderLast:
    - ValidatingWebhookConfiguration

resources:
# Stub Istio CRDs — profiles-controller watches AuthorizationPolicy unconditionally at startup.
# Without the CRD, cache sync fails and the controller crashes. These stubs satisfy the watch.
- stub-istio-crds.yaml
# cert-manager kubeflow issuer — cert-manager itself is already installed; the overlay's NetworkPolicies are deleted below
- github.com/kubeflow/community-distribution//common/cert-manager/overlays/kubeflow?ref=26.03.1
# Kubeflow namespace + roles
- github.com/kubeflow/community-distribution//common/kubeflow-namespace/base?ref=26.03.1
- github.com/kubeflow/community-distribution//common/kubeflow-roles/base?ref=26.03.1
# Kubeflow Pipelines — SeaweedFS + MySQL + cert-manager TLS, platform-agnostic multi-user
- github.com/kubeflow/community-distribution//applications/pipeline/upstream/env/cert-manager/platform-agnostic-multi-user?ref=26.03.1
# Katib — hyperparameter tuning with Kubeflow integration (includes MySQL)
- github.com/kubeflow/community-distribution//applications/katib/upstream/installs/katib-with-kubeflow?ref=26.03.1
# Dashboard (base — no oauth2-proxy/Istio overlay); the Service is named "dashboard"
- github.com/kubeflow/community-distribution//applications/dashboard/upstream/centraldashboard/base?ref=26.03.1
# PodDefaults webhook (GPU node injection per-notebook)
- github.com/kubeflow/community-distribution//applications/dashboard/upstream/poddefaults-webhooks/overlays/cert-manager?ref=26.03.1
# Profiles + KFAM; the PSS overlay labels profile namespaces with baseline Pod Security
- github.com/kubeflow/community-distribution//applications/dashboard/upstream/profile-controller/overlays/kubeflow-pss?ref=26.03.1
# Notebooks v1 — web apps from base (no Istio VirtualService), controllers from the kubeflow overlay
- github.com/kubeflow/community-distribution//applications/notebooks-v1/upstream/jupyter-web-app/base?ref=26.03.1
- github.com/kubeflow/community-distribution//applications/notebooks-v1/upstream/notebook-controller/overlays/kubeflow?ref=26.03.1
- github.com/kubeflow/community-distribution//applications/notebooks-v1/upstream/pvcviewer-controller/base?ref=26.03.1
- github.com/kubeflow/community-distribution//applications/notebooks-v1/upstream/volumes-web-app/base?ref=26.03.1
- github.com/kubeflow/community-distribution//applications/notebooks-v1/upstream/tensorboard-controller/overlays/kubeflow?ref=26.03.1
- github.com/kubeflow/community-distribution//applications/notebooks-v1/upstream/tensorboards-web-app/base?ref=26.03.1
# Trainer (Training Operator v2) — TrainJob, TrainingRuntime, JobSet
- github.com/kubeflow/community-distribution//applications/trainer/overlays?ref=26.03.1
# Spark Operator
- github.com/kubeflow/community-distribution//applications/spark/spark-operator/overlays/kubeflow?ref=26.03.1
# Default user profile (creates kubeflow-user-example-com namespace)
- github.com/kubeflow/community-distribution//common/user-namespace/base?ref=26.03.1

patches:
# Fix Profile name — user-namespace/base uses $(profile-name) vars substitution which
# is broken in kustomize 5.8.0 (replacements selector itself contains the var reference).
# Explicitly rename the Profile to the correct value from params.env.
- patch: |-
    - op: replace
      path: /metadata/name
      value: kubeflow-user-example-com
    - op: replace
      path: /spec/owner/name
      value: user@example.com
  target:
    group: kubeflow.org
    kind: Profile
# Delete every upstream NetworkPolicy (kubeflow, kubeflow-system and cert-manager namespaces).
# They allow ingress only from istio-system or same-namespace pods. Cilium-envoy is hostNetwork,
# so its node-IP traffic matches no pod selector and gets cx_connect_fail; the SeaweedFS policy
# also blocks the pipelines profile controller from initialising user namespaces.
- patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: unused
  target:
    kind: NetworkPolicy
# Strip all Istio resources — pipeline and katib overlays embed DestinationRules,
# VirtualServices, and AuthorizationPolicies even in "platform-agnostic" variants.
# These CRDs do not exist without Istio installed.
- patch: |-
    $patch: delete
    apiVersion: networking.istio.io/v1alpha3
    kind: DestinationRule
    metadata:
      name: unused
  target:
    group: networking.istio.io
    kind: DestinationRule
- patch: |-
    $patch: delete
    apiVersion: networking.istio.io/v1alpha3
    kind: VirtualService
    metadata:
      name: unused
  target:
    group: networking.istio.io
    kind: VirtualService
- patch: |-
    $patch: delete
    apiVersion: security.istio.io/v1beta1
    kind: AuthorizationPolicy
    metadata:
      name: unused
  target:
    group: security.istio.io
    kind: AuthorizationPolicy
