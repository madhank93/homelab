name: Deploy Docs

on:
  push:
    branches:
      - main
      - 'v*'  # Release branches, so a version cut does not strand the docs
    paths:
      - 'docs/**'
      - 'scripts/docs-version-check.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# main and any v* branch publish to the same gh-pages with keep_files: false.
# Serialise them so a slow run cannot overwrite a newer deploy.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  # Keep in step with [markdown.highlighting] in docs/config.toml — 0.21 renamed
  # that table and dropped several themes, so the two versions move together.
  ZOLA_VERSION: 0.22.1

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Zola
        run: |
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Check documented versions against code
        run: ./scripts/docs-version-check.sh

      - name: Build docs
        working-directory: docs
        run: zola build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: deploy docs [skip ci]'
