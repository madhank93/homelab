name: Deploy Docs

on:
  push:
    branches:
      - main   # guard + build only; the deploy step skips it
      - 'v*'   # release branches: these are what the live site is built from
    paths:
      - 'docs/**'
      - 'scripts/docs-version-check.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Only the current release branch publishes. main still builds and runs the
# version guard, but does not deploy: two branches publishing to the same
# gh-pages with keep_files: false made the live site depend on which run
# finished last.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  # Keep in step with [markdown.highlighting] in docs/config.toml — 0.21 renamed
  # that table and dropped several themes, so the two versions move together.
  ZOLA_VERSION: 0.22.1

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Zola
        run: |
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Check documented versions against code
        run: ./scripts/docs-version-check.sh

      - name: Build docs
        working-directory: docs
        run: zola build

      - name: Deploy to GitHub Pages
        # Release branches only. docs/config.toml pins source_ref and edit_url
        # to the release being documented, so that branch is what the site
        # should show.
        if: startsWith(github.ref, 'refs/heads/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: deploy docs [skip ci]'
