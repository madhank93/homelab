name: Deploy Docs

on:
  push:
    branches:
      - main   # guard + build only; the deploy step skips it
      - 'v*'   # release branches: these are what the live site is built from
    paths:
      - 'docs/**'
      # The version check compares docs against these, so a pin bump must rerun it.
      - 'config/**'
      - 'core/**'
      - 'workloads/**'
      - 'scripts/docs-version-check.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Only the current release branch publishes. main still builds and runs the
# version guard, but does not deploy: two branches publishing to the same
# gh-pages with keep_files: false made the live site depend on which run
# finished last.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes gh-pages from release branches

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Starlight dates each page from its last commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Check documented versions against code
        run: ./scripts/docs-version-check.sh

      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        # Release branches only. docs/astro.config.mjs pins the ref that edit and
        # source links point at, so that branch is what the site should show.
        if: startsWith(github.ref, 'refs/heads/v')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: deploy docs [skip ci]'
