name: Deploy Docs

on:
  push:
    branches:
      - main   # guard + build only; the deploy step skips it
      - 'v*'   # release branches: these are what the live site is built from
    paths:
      - 'docs/**'
      - 'scripts/docs-version-check.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Only the current release branch publishes. main still builds and runs the
# version guard, but does not deploy: two branches publishing to the same
# gh-pages with keep_files: false made the live site depend on which run
# finished last.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with [markdown.highlighting] in docs/config.toml — 0.21 renamed
  # that table and dropped several themes, so the two versions move together.
  # Held on 0.22: 0.23 switched to Tera 2, and the goyo theme's templates fail
  # to parse under it. Bump once goyo supports Tera 2.
  ZOLA_VERSION: 0.22.1
  # sha256 of zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz; bump with the version.
  ZOLA_SHA256: 0ca09aa40376aaa9ddfb512ff9ad963262ef95edb0d0f2d5ec6961b6f5cf22ef

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes gh-pages from release branches

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Zola
        run: |
          tarball="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${tarball}"
          echo "${ZOLA_SHA256}  ${tarball}" | sha256sum --check --strict
          sudo tar -xzf "$tarball" -C /usr/local/bin zola
          rm "$tarball"

      - name: Check documented versions against code
        run: ./scripts/docs-version-check.sh

      - name: Build docs
        working-directory: docs
        run: zola build

      - name: Deploy to GitHub Pages
        # Release branches only. docs/config.toml pins source_ref and edit_url
        # to the release being documented, so that branch is what the site
        # should show.
        if: startsWith(github.ref, 'refs/heads/v')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: deploy docs [skip ci]'
