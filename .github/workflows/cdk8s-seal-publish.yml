name: CDK8s Publish

on:
  push:
    branches:
      - main
      - 'v*'  # Trigger on release branches (v0.1.5, etc)
    paths:
      - 'workloads/**'
      - 'scripts/manifest-secret-guard.sh'
      - 'scripts/manifest-secret-allowlist.txt'
      - '.github/workflows/cdk8s-seal-publish.yml'
  # A new release branch must publish its manifests branch even when its first
  # commits touch only core/ or docs/. ArgoCD is repointed to <branch>-manifests
  # by `just core platform up`; if that branch does not exist yet, every
  # Application loses its source at once.
  create:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # `create` has no branch filter in `on:`, so gate it here — otherwise every
    # feature branch would publish its own manifests branch.
    if: >-
      github.event_name != 'create' ||
      (github.ref_type == 'branch' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes <branch>-manifests

    env:
      # Bump both together; checksum from the release's checksums.txt.
      KUSTOMIZE_VERSION: v5.8.3
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61

    steps:
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: workloads/go.sum

      - name: Synthesize CDK8s manifests
        working-directory: workloads
        env:
          GOWORK: "off"
        run: |
          go mod download
          go run .
          ls -la ../app/

      - name: Install kustomize
        run: |
          tarball="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tarball}"
          echo "${KUSTOMIZE_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Build Kubeflow manifests
        working-directory: workloads
        run: |
          kustomize build ai/kubeflow/ > ../app/kubeflow/kubeflow-manifests.yaml

      # The manifests branch is public: block any newly rendered Secret payload.
      - name: Guard against rendered Secrets
        run: ./scripts/manifest-secret-guard.sh app

      - name: Deploy Manifests to Branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: ${{ github.ref_name }}-manifests
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update kubernetes manifests [skip ci]'

      - name: Cleanup
        if: always()
        run: rm -rf app
