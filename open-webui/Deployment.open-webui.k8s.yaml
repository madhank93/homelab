apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - env:
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: DEFAULT_USER_ROLE
              value: pending
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: DEFAULT_MODEL_METADATA
              value: '{"capabilities":{"builtin_tools":false}}'
          image: ghcr.io/open-webui/open-webui:v0.12.5
          imagePullPolicy: IfNotPresent
          name: open-webui
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - mountPath: /app/backend/data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
